# Regenerates metrics.svg (the middle dashboard of the profile README) every day.
# Needs one repo secret: METRICS_TOKEN (classic PAT, scopes: repo, read:user, read:org).
# Optional: PAGESPEED_TOKEN (Google PageSpeed API key); without it the pagespeed plugin often hits Google's shared quota.
# If METRICS_TOKEN is missing, the metrics step is skipped so the committed metrics.svg is left as-is.
name: Metrics
on:
  schedule: [{ cron: "30 18 * * *" }]   # 00:00 IST
  workflow_dispatch:
  push: { branches: ["main"] }
permissions:
  contents: write
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - name: Skip when METRICS_TOKEN is missing
        if: ${{ env.METRICS_TOKEN == '' }}
        run: echo "METRICS_TOKEN is not set; leaving the committed metrics.svg unchanged."
      - uses: lowlighter/metrics@latest
        if: ${{ env.METRICS_TOKEN != '' }}
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: shashankgowda7755
          filename: metrics.svg
          template: classic
          config_display: large
          config_timezone: Asia/Kolkata
          base: header, activity, community, repositories, metadata
          repositories_affiliations: owner, collaborator

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_days: 90
          plugin_habits_from: 200
          plugin_habits_trim: yes

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_threshold: 1%

          plugin_stars: yes
          plugin_stars_limit: 3

          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C

          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_repositories: yes

          plugin_pagespeed: yes
          plugin_pagespeed_url: https://oias.in
          plugin_pagespeed_detailed: no
          plugin_pagespeed_token: ${{ secrets.PAGESPEED_TOKEN }}
